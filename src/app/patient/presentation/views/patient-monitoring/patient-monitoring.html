<div class="view-container">
  <div class="page-hero">
    @if (patient(); as p) {
      <div>
        <span class="eyebrow">{{ 'monitoring.eyebrow' | translate }}</span>
        <h2>{{ p.fullName }}</h2>
        <p>ID: {{ p.code }} · DNI: {{ p.documentNumber }} · {{ p.age }} años · Habitación {{ p.roomNumber }} · Cama {{ p.bedNumber }}</p>
      </div>
      <button class="btn-secondary" (click)="goBack()">{{ 'monitoring.back' | translate }}</button>
    } @else {
      <div>
        <span class="eyebrow">{{ 'monitoring.eyebrow' | translate }}</span>
        <h2>{{ 'monitoring.noPatient' | translate }}</h2>
      </div>
      <button class="btn-secondary" (click)="goBack()">{{ 'monitoring.back' | translate }}</button>
    }
  </div>
</div>
