<main class="access-page">
  <section class="access-panel">
    <div class="access-topbar">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none">
          <rect
            x="4"
            y="4"
            width="24"
            height="24"
            rx="4"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M9 18L14 13L18 17L23 12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <app-language-switcher></app-language-switcher>
    </div>

    <div class="access-copy">
      <span>{{ 'access.eyebrow' | translate }}</span>
      <h1>{{ 'access.title' | translate }}</h1>
      <p>{{ 'access.subtitle' | translate }}</p>
    </div>

    <div class="access-options">
      <button type="button" class="role-card admin" (click)="enterAs('admin')">
        <span class="role-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M12 3l7 4v5c0 5-3 8-7 9c-4-1-7-4-7-9V7l7-4z" />
            <path d="M9 12l2 2l4-5" />
          </svg>
        </span>
        <strong>{{ 'access.adminTitle' | translate }}</strong>
        <small>{{ 'access.adminText' | translate }}</small>
      </button>

      <button type="button" class="role-card user" (click)="enterAs('user')">
        <span class="role-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </span>
        <strong>{{ 'access.userTitle' | translate }}</strong>
        <small>{{ 'access.userText' | translate }}</small>
      </button>
    </div>
  </section>

  <aside class="access-preview">
    <div class="preview-header">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="preview-metrics">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="preview-table">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </aside>
</main>
