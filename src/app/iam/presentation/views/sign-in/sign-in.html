<main class="auth-page">
  <section class="auth-card">
    <div class="brand-mark">PR</div>
    <h1>{{ 'auth.signIn.title' | translate }}</h1>
    <p class="auth-subtitle">{{ 'auth.signIn.subtitle' | translate }}</p>

    <form (ngSubmit)="signIn()" class="auth-form">
      <label>{{ 'auth.username' | translate }}
        <input name="username" [(ngModel)]="form.username" autocomplete="username" required />
      </label>
      <label>{{ 'auth.password' | translate }}
        <input name="password" type="password" [(ngModel)]="form.password" autocomplete="current-password" required />
      </label>

      @if (iamStore.errorMessage()) {
        <p class="error-message">{{ iamStore.errorMessage() }}</p>
      }

      <button type="submit" [disabled]="iamStore.isLoading()">
        {{ iamStore.isLoading() ? ('auth.validating' | translate) : ('auth.enter' | translate) }}
      </button>
    </form>

    <div class="demo-box">
      <span>{{ 'auth.demoUser' | translate }}</span>
      <code>enfermera.ana</code> / <code>123456</code>
    </div>

    <p class="auth-link">{{ 'auth.noAccount' | translate }} <a routerLink="/sign-up">{{ 'auth.createAccount' | translate }}</a></p>
  </section>
</main>
